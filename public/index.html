<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lunas de Octubre | Catálogo</title>

    <meta name="description" content="Catálogo oficial de Lunas de Octubre">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>

        /* =========================================================
           VARIABLES
        ========================================================= */

        :root {
            --fondo: #070711;
            --fondo-2: #0e0d1b;
            --tarjeta: rgba(255, 255, 255, 0.055);

            --dorado: #d8b46a;
            --dorado-claro: #f2d99a;

            --blanco: #ffffff;
            --gris: #aaa8b7;

            --verde: #25d366;

            --borde: rgba(216, 180, 106, 0.18);

            --sombra:
                0 25px 70px rgba(0, 0, 0, 0.45);
        }


        /* =========================================================
           RESET
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            font-family: 'Montserrat', sans-serif;

            color: var(--blanco);

            background:
                radial-gradient(
                    circle at 50% -10%,
                    rgba(108, 63, 180, 0.30),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 90% 40%,
                    rgba(216, 180, 106, 0.08),
                    transparent 30%
                ),
                var(--fondo);
        }

        button,
        input {
            font-family: inherit;
        }

        a {
            color: inherit;
            text-decoration: none;
        }


        /* =========================================================
           HEADER
        ========================================================= */

        header {
            position: sticky;
            top: 0;
            z-index: 100;

            backdrop-filter: blur(18px);

            background: rgba(7, 7, 17, 0.82);

            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }

        .header-inner {
            width: min(1200px, 92%);

            margin: auto;

            min-height: 76px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;
        }


        /* LOGO */

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-moon {
            width: 42px;
            height: 42px;

            display: grid;
            place-items: center;

            border-radius: 50%;

            color: var(--dorado-claro);

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #ffffff,
                    #e8d49e 28%,
                    #b78b3e 70%
                );

            box-shadow:
                0 0 25px rgba(216, 180, 106, 0.28);
        }

        .logo-moon::after {
            content: "";

            width: 34px;
            height: 34px;

            border-radius: 50%;

            background: var(--fondo);

            transform: translate(7px, -4px);
        }

        .logo-text {
            display: flex;
            flex-direction: column;
        }

        .logo-title {
            font-family: 'Cormorant Garamond', serif;

            font-size: 25px;
            line-height: 1;

            color: var(--dorado-claro);
        }

        .logo-subtitle {
            margin-top: 4px;

            font-size: 9px;
            letter-spacing: 2.5px;

            color: var(--gris);
            text-transform: uppercase;
        }


        /* WHATSAPP HEADER */

        .header-whatsapp {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            padding: 11px 18px;

            border-radius: 30px;

            font-size: 12px;
            font-weight: 600;

            color: #061108;

            background: var(--verde);

            transition: 0.25s;
        }

        .header-whatsapp:hover {
            transform: translateY(-2px);

            box-shadow:
                0 10px 25px rgba(37, 211, 102, 0.22);
        }


        /* =========================================================
           HERO
        ========================================================= */

        .hero {
            width: min(1200px, 92%);

            margin: auto;

            min-height: 390px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;

            position: relative;
        }

        .hero-glow {
            position: absolute;

            width: 330px;
            height: 330px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(216, 180, 106, 0.13),
                    transparent 68%
                );

            pointer-events: none;
        }

        .hero-label {
            position: relative;

            margin-bottom: 12px;

            font-size: 11px;
            letter-spacing: 4px;

            color: var(--dorado);

            text-transform: uppercase;
        }

        .hero h1 {
            position: relative;

            font-family: 'Cormorant Garamond', serif;

            font-size: clamp(58px, 9vw, 105px);

            line-height: 0.85;

            font-weight: 600;

            color: var(--blanco);

            text-shadow:
                0 10px 45px rgba(0, 0, 0, 0.4);
        }

        .hero h1 span {
            color: var(--dorado-claro);
        }

        .hero-line {
            width: 70px;
            height: 1px;

            margin: 24px auto;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--dorado),
                    transparent
                );
        }

        .hero-text {
            position: relative;

            color: var(--gris);

            font-size: 13px;

            letter-spacing: 1px;
        }


        /* =========================================================
           BUSCADOR
        ========================================================= */

        .catalogo {
            width: min(1200px, 92%);

            margin: 0 auto 80px;
        }

        .tools {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;

            margin-bottom: 25px;
        }

        .search {
            position: relative;

            flex: 1;

            max-width: 500px;
        }

        .search svg {
            position: absolute;

            left: 18px;
            top: 50%;

            width: 18px;

            transform: translateY(-50%);

            color: var(--dorado);
        }

        .search input {
            width: 100%;

            padding: 15px 20px 15px 50px;

            border: 1px solid var(--borde);

            border-radius: 40px;

            outline: none;

            color: white;

            background: rgba(255, 255, 255, 0.045);

            transition: 0.25s;
        }

        .search input::placeholder {
            color: #777582;
        }

        .search input:focus {
            border-color: rgba(216, 180, 106, 0.55);

            background: rgba(255, 255, 255, 0.07);

            box-shadow:
                0 0 0 4px rgba(216, 180, 106, 0.05);
        }

        .contador {
            color: var(--gris);

            font-size: 12px;

            white-space: nowrap;
        }


        /* =========================================================
           CATEGORIAS
        ========================================================= */

        .categorias {
            display: flex;

            gap: 9px;

            overflow-x: auto;

            padding-bottom: 8px;

            margin-bottom: 35px;

            scrollbar-width: none;
        }

        .categorias::-webkit-scrollbar {
            display: none;
        }

        .categoria-btn {
            flex-shrink: 0;

            padding: 9px 17px;

            border: 1px solid rgba(255, 255, 255, 0.09);

            border-radius: 30px;

            color: #aaa8b7;

            background: rgba(255, 255, 255, 0.035);

            cursor: pointer;

            font-size: 11px;

            transition: 0.25s;
        }

        .categoria-btn:hover,
        .categoria-btn.active {
            color: #15120b;

            border-color: var(--dorado);

            background: var(--dorado);
        }


        /* =========================================================
           TITULO CATALOGO
        ========================================================= */

        .section-title {
            display: flex;
            align-items: end;
            justify-content: space-between;

            margin-bottom: 22px;
        }

        .section-title h2 {
            font-family: 'Cormorant Garamond', serif;

            font-size: 38px;

            font-weight: 600;
        }

        .section-title span {
            font-size: 11px;

            color: var(--gris);

            letter-spacing: 1px;
        }


        /* =========================================================
           GRID
        ========================================================= */

        #productos {
            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 20px;
        }


        /* =========================================================
           CARD
        ========================================================= */

        .producto {
            overflow: hidden;

            position: relative;

            border: 1px solid rgba(255, 255, 255, 0.07);

            border-radius: 22px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.075),
                    rgba(255, 255, 255, 0.025)
                );

            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.18);

            transition:
                transform 0.3s ease,
                border-color 0.3s ease,
                box-shadow 0.3s ease;
        }

        .producto:hover {
            transform: translateY(-7px);

            border-color:
                rgba(216, 180, 106, 0.32);

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.35);
        }


        /* IMAGEN */

        .producto-imagen {
            height: 270px;

            position: relative;

            overflow: hidden;

            background:
                radial-gradient(
                    circle,
                    #211d32,
                    #0d0c16
                );

            cursor: pointer;
        }

        .producto-imagen img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;

            transition: transform 0.5s ease;
        }

        .producto:hover .producto-imagen img {
            transform: scale(1.055);
        }

        .producto-imagen::after {
            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    to top,
                    rgba(0, 0, 0, 0.35),
                    transparent 45%
                );

            pointer-events: none;
        }


        /* BADGE */

        .badge {
            position: absolute;

            top: 14px;
            left: 14px;

            z-index: 2;

            padding: 7px 11px;

            border-radius: 20px;

            font-size: 9px;

            letter-spacing: 0.7px;

            color: #17120a;

            background: var(--dorado-claro);

            font-weight: 700;
        }


        /* CONTENIDO */

        .producto-info {
            padding: 19px;
        }

        .producto-categoria {
            margin-bottom: 7px;

            color: var(--dorado);

            font-size: 9px;

            text-transform: uppercase;

            letter-spacing: 1.6px;

            font-weight: 600;
        }

        .producto-nombre {
            min-height: 44px;

            font-family: 'Cormorant Garamond', serif;

            font-size: 25px;

            line-height: 1;

            color: white;
        }

        .producto-descripcion {
            margin-top: 8px;

            min-height: 34px;

            color: #898795;

            font-size: 10px;

            line-height: 1.55;
        }


        /* PRECIO */

        .producto-bottom {
            display: flex;
            align-items: end;
            justify-content: space-between;

            gap: 10px;

            margin-top: 18px;
        }

        .precio-label {
            display: block;

            margin-bottom: 3px;

            color: #777582;

            font-size: 8px;

            text-transform: uppercase;

            letter-spacing: 1px;
        }

        .precio {
            color: var(--dorado-claro);

            font-size: 20px;

            font-weight: 700;
        }


        /* STOCK */

        .stock {
            margin-top: 9px;

            color: #7f7d89;

            font-size: 9px;
        }

        .stock.disponible {
            color: #68d391;
        }

        .stock.agotado {
            color: #f47d7d;
        }


        /* WHATSAPP */

        .btn-whatsapp {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 43px;
            height: 43px;

            flex-shrink: 0;

            border-radius: 50%;

            color: white;

            background: var(--verde);

            transition: 0.25s;
        }

        .btn-whatsapp:hover {
            transform: scale(1.08);

            box-shadow:
                0 10px 25px rgba(37, 211, 102, 0.25);
        }

        .btn-whatsapp svg {
            width: 20px;
            height: 20px;
        }


        /* =========================================================
           LOADER
        ========================================================= */

        .loader-container {
            min-height: 250px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loader {
            width: 40px;
            height: 40px;

            border: 2px solid rgba(255, 255, 255, 0.1);

            border-top-color: var(--dorado);

            border-radius: 50%;

            animation: girar 0.8s linear infinite;
        }

        @keyframes girar {
            to {
                transform: rotate(360deg);
            }
        }


        /* =========================================================
           ESTADO VACIO
        ========================================================= */

        .vacio {
            grid-column: 1 / -1;

            padding: 70px 20px;

            text-align: center;

            border: 1px dashed rgba(255, 255, 255, 0.1);

            border-radius: 20px;

            color: var(--gris);
        }

        .vacio strong {
            display: block;

            margin-bottom: 7px;

            color: white;

            font-family: 'Cormorant Garamond', serif;

            font-size: 28px;
        }


        /* =========================================================
           MODAL IMAGEN
        ========================================================= */

        .modal {
            position: fixed;

            inset: 0;

            z-index: 999;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            background: rgba(0, 0, 0, 0.9);

            backdrop-filter: blur(10px);
        }

        .modal.active {
            display: flex;
        }

        .modal img {
            max-width: 94vw;
            max-height: 88vh;

            object-fit: contain;

            border-radius: 15px;

            box-shadow:
                0 30px 100px rgba(0, 0, 0, 0.7);
        }

        .cerrar-modal {
            position: absolute;

            top: 20px;
            right: 25px;

            width: 45px;
            height: 45px;

            border: 1px solid rgba(255, 255, 255, 0.15);

            border-radius: 50%;

            color: white;

            background: rgba(255, 255, 255, 0.08);

            cursor: pointer;

            font-size: 20px;
        }


        /* =========================================================
           FOOTER
        ========================================================= */

        footer {
            padding: 45px 20px;

            border-top: 1px solid rgba(255, 255, 255, 0.06);

            text-align: center;

            background: rgba(0, 0, 0, 0.18);
        }

        .footer-logo {
            font-family: 'Cormorant Garamond', serif;

            font-size: 32px;

            color: var(--dorado-claro);
        }

        .footer-line {
            width: 50px;
            height: 1px;

            margin: 13px auto;

            background: var(--dorado);
        }

        .footer-text {
            color: #777582;

            font-size: 10px;

            letter-spacing: 1px;
        }

        .footer-whatsapp {
            display: inline-flex;

            margin-top: 18px;

            color: var(--verde);

            font-size: 11px;

            font-weight: 600;
        }


        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media (max-width: 1050px) {

            #productos {
                grid-template-columns:
                    repeat(3, minmax(0, 1fr));
            }

        }


        @media (max-width: 760px) {

            .header-inner {
                min-height: 68px;
            }

            .header-whatsapp {
                padding: 10px 13px;

                font-size: 10px;
            }

            .hero {
                min-height: 330px;
            }

            .hero h1 {
                font-size: 68px;
            }

            .tools {
                align-items: stretch;

                flex-direction: column;
            }

            .search {
                max-width: none;
            }

            .contador {
                text-align: center;
            }

            #productos {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                gap: 13px;
            }

            .producto-imagen {
                height: 220px;
            }

            .producto-info {
                padding: 15px;
            }

            .producto-nombre {
                font-size: 22px;
            }

            .producto-descripcion {
                font-size: 9px;
            }

            .precio {
                font-size: 18px;
            }

        }


        @media (max-width: 430px) {

            .logo-title {
                font-size: 21px;
            }

            .logo-subtitle {
                font-size: 7px;
            }

            .logo-moon {
                width: 37px;
                height: 37px;
            }

            .header-whatsapp {
                font-size: 0;

                width: 39px;
                height: 39px;

                padding: 0;

                justify-content: center;
            }

            .hero h1 {
                font-size: 57px;
            }

            .hero-text {
                font-size: 11px;
            }

            .section-title h2 {
                font-size: 32px;
            }

            .section-title span {
                font-size: 9px;
            }

            #productos {
                gap: 10px;
            }

            .producto {
                border-radius: 17px;
            }

            .producto-imagen {
                height: 185px;
            }

            .producto-info {
                padding: 12px;
            }

            .producto-categoria {
                font-size: 8px;
            }

            .producto-nombre {
                font-size: 20px;
                min-height: 40px;
            }

            .producto-descripcion {
                min-height: 32px;

                font-size: 8px;
            }

            .producto-bottom {
                margin-top: 13px;
            }

            .precio {
                font-size: 16px;
            }

            .btn-whatsapp {
                width: 37px;
                height: 37px;
            }

        }


        @media (max-width: 340px) {

            #productos {
                grid-template-columns: 1fr;
            }

            .producto-imagen {
                height: 250px;
            }

        }

    </style>
</head>


<body>

        const textoCategoria =
            document.getElementById("textoCategoria");

        const modalImagen =
            document.getElementById("modalImagen");

        const imagenModal =
            document.getElementById("imagenModal");

        const cerrarModal =
            document.getElementById("cerrarModal");


        /* =========================================================
           VARIABLES
        ========================================================= */

        let productos = [];

        let categoriaActual = "Todos";

        let busquedaActual = "";


        /* =========================================================
           ESCAPAR HTML
        ========================================================= */

        function escaparHTML(texto) {

            return String(texto)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* =========================================================
           ESCAPAR JAVASCRIPT
        ========================================================= */

        function escaparJS(texto) {

            return String(texto)
                .replace(/\\/g, "\\\\")
                .replace(/'/g, "\\'");

        }


        /* =========================================================
           PRECIO
        ========================================================= */

        function formatearPrecio(valor) {

            return Number(valor || 0).toLocaleString(
                "es-CO",
                {
                    style: "currency",
                    currency: "COP",
                    maximumFractionDigits: 0
                }
            );

        }


        /* =========================================================
           CARGAR PRODUCTOS
        ========================================================= */

        async function cargarProductos() {

            try {

                const respuesta =
                    await fetch(`${API}/productos`);

                if (!respuesta.ok) {
                    throw new Error(
                        "No se pudieron cargar los productos."
                    );
                }

                const datos =
                    await respuesta.json();

                productos = Array.isArray(datos)
                    ? datos.filter(
                        producto =>
                            producto.activo !== false
                    )
                    : [];

                crearCategorias();

                mostrarProductos();

            } catch (error) {

                console.error(error);

                contenedorProductos.innerHTML = `

                    <div class="vacio">

                        <strong>
                            Catálogo temporalmente no disponible
                        </strong>

                        Intenta nuevamente en unos minutos.

                    </div>

                `;

                contadorProductos.textContent =
                    "Sin conexión";

            }

        }


        /* =========================================================
           CREAR CATEGORIAS
        ========================================================= */

        function crearCategorias() {

            const nombres =
                productos
                    .map(
                        producto =>
                            producto.categoria_nombre ||
                            producto.categoria ||
                            "Otros"
                    )
                    .filter(Boolean);

            const categoriasUnicas =
                [...new Set(nombres)]
                    .sort(
                        (a, b) =>
                            a.localeCompare(b)
                    );


            categorias.innerHTML = `

                <button
                    class="categoria-btn active"
                    data-categoria="Todos"
                >
                    Todos
                </button>

                ${
                    categoriasUnicas
                        .map(
                            categoria => `

                                <button
                                    class="categoria-btn"
                                    data-categoria="${escaparHTML(categoria)}"
                                >
                                    ${escaparHTML(categoria)}
                                </button>

                            `
                        )
                        .join("")
                }

            `;


            document
                .querySelectorAll(".categoria-btn")
                .forEach(boton => {

                    boton.addEventListener(
                        "click",
                        () => {

                            document
                                .querySelectorAll(
                                    ".categoria-btn"
                                )
                                .forEach(btn =>
                                    btn.classList.remove(
                                        "active"
                                    )
                                );

                            boton.classList.add("active");

                            categoriaActual =
                                boton.dataset.categoria;

                            textoCategoria.textContent =
                                categoriaActual.toUpperCase();

                            mostrarProductos();

                        }
                    );

                });

        }


        /* =========================================================
           MOSTRAR PRODUCTOS
        ========================================================= */

        function mostrarProductos() {

            const termino =
                busquedaActual
                    .toLowerCase()
                    .trim();


            const filtrados =
                productos.filter(producto => {

                    const nombre =
                        producto.nombre ||
                        producto.descripcion ||
                        "Producto";

                    const descripcion =
                        producto.descripcion || "";

                    const categoria =
                        producto.categoria_nombre ||
                        producto.categoria ||
                        "Otros";


                    const coincideBusqueda =
                        !termino ||
                        nombre
                            .toLowerCase()
                            .includes(termino) ||
                        descripcion
                            .toLowerCase()
                            .includes(termino) ||
                        categoria
                            .toLowerCase()
                            .includes(termino);


                    const coincideCategoria =
                        categoriaActual === "Todos" ||
                        categoria === categoriaActual;


                    return (
                        coincideBusqueda &&
                        coincideCategoria
                    );

                });


            contadorProductos.textContent =
                `${filtrados.length} ${
                    filtrados.length === 1
                        ? "producto"
                        : "productos"
                }`;


            if (!filtrados.length) {

                contenedorProductos.innerHTML = `

                    <div class="vacio">

                        <strong>
                            No encontramos productos
                        </strong>

                        Prueba con otra búsqueda.

                    </div>

                `;

                return;

            }


            contenedorProductos.innerHTML =
                filtrados
                    .map(crearProductoHTML)
                    .join("");

        }


        /* =========================================================
           CREAR CARD
        ========================================================= */

        function crearProductoHTML(producto) {

            const nombre =
                producto.nombre ||
                producto.descripcion ||
                "Producto";


            const descripcion =
                producto.descripcion ||
                "Producto disponible en nuestro catálogo.";


            const categoria =
                producto.categoria_nombre ||
                producto.categoria ||
                "Otros";


            const precio =
                producto.precio_venta ??
                producto.precio ??
                0;


            const cantidad =
                Number(
                    producto.cantidad ?? 0
                );


            const imagen =
                producto.imagen_url ||
                producto.imagen ||
                "";


            const mensaje =
                `Hola, quiero el producto: ${nombre} por ${formatearPrecio(precio)}`;


            const whatsappURL =
                `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(mensaje)}`;


            const stockClase =
                cantidad > 0
                    ? "disponible"
                    : "agotado";


            const stockTexto =
                cantidad > 0
                    ? `Disponible · ${cantidad} unidades`
                    : "Agotado";


            const imagenHTML =
                imagen
                    ? `

                        <img
                            src="${escaparHTML(imagen)}"
                            alt="${escaparHTML(nombre)}"
                            loading="lazy"
                            onclick="abrirImagen('${escaparJS(imagen)}')"
                        >

                    `
                    : `

                        <div
                            style="
                                width:100%;
                                height:100%;
                                display:grid;
                                place-items:center;
                                color:#777;
                                font-size:11px;
                            "
                        >
                            Sin imagen
                        </div>

                    `;


            return `

                <article class="producto">


                    <div class="producto-imagen">

                        <div class="badge">
                            ${escaparHTML(categoria)}
                        </div>

                        ${imagenHTML}

                    </div>


                    <div class="producto-info">


                        <div class="producto-categoria">
                            ${escaparHTML(categoria)}
                        </div>


                        <div class="producto-nombre">
                            ${escaparHTML(nombre)}
                        </div>


                        <div class="producto-descripcion">
                            ${escaparHTML(descripcion)}
                        </div>


                        <div class="producto-bottom">


                            <div>

                                <span class="precio-label">
                                    Precio
                                </span>

                                <div class="precio">
                                    ${formatearPrecio(precio)}
                                </div>

                                <div class="stock ${stockClase}">
                                    ${stockTexto}
                                </div>

                            </div>


                            <a
                                class="btn-whatsapp"
                                href="${whatsappURL}"
                                target="_blank"
                                rel="noopener"
                                aria-label="Comprar por WhatsApp"
                            >

                                <svg
                                    viewBox="0 0 24 24"
                                    fill="currentColor"
                                >
                                    <path d="M20.52 3.48A11.78 11.78 0 0012.07 0C5.56 0 .26 5.3.26 11.81c0 2.08.54 4.11 1.56 5.9L.16 24l6.43-1.69a11.78 11.78 0 005.48 1.35h.01c6.51 0 11.81-5.3 11.81-11.81 0-3.16-1.23-6.13-3.37-8.37zM12.08 21.6h-.01a9.78 9.78 0 01-4.98-1.36l-.36-.21-3.82 1 1.02-3.72-.23-.38a9.77 9.77 0 01-1.5-5.12C2.2 6.4 6.62 2 12.08 2c2.65 0 5.14 1.03 7.01 2.9a9.84 9.84 0 012.9 7.01c0 5.46-4.45 9.89-9.91 9.89zm5.42-7.39c-.3-.15-1.78-.88-2.05-.98-.27-.1-.47-.15-.67.15-.2.3-.77.98-.95 1.18-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.47-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.49s1.07 2.89 1.22 3.09c.15.2 2.1 3.21 5.09 4.5.71.31 1.27.5 1.7.64.71.23 1.36.2 1.87.12.57-.08 1.78-.73 2.03-1.44.25-.71.25-1.32.17-1.44-.07-.12-.27-.2-.57-.35z"/>
                                </svg>

                            </a>

                        </div>

                    </div>

                </article>

            `;

        }


        /* =========================================================
           BUSQUEDA
        ========================================================= */

        buscarProducto.addEventListener(
            "input",
            evento => {

                busquedaActual =
                    evento.target.value;

                mostrarProductos();

            }
        );


        /* =========================================================
           ABRIR IMAGEN
        ========================================================= */

        function abrirImagen(url) {

            imagenModal.src = url;

            modalImagen.classList.add("active");

        }


        /* =========================================================
           CERRAR MODAL
        ========================================================= */

        function cerrarImagen() {

            modalImagen.classList.remove(
                "active"
            );

            imagenModal.src = "";

        }


        cerrarModal.addEventListener(
            "click",
            cerrarImagen
        );


        modalImagen.addEventListener(
            "click",
            evento => {

                if (
                    evento.target === modalImagen
                ) {
                    cerrarImagen();
                }

            }
        );


        document.addEventListener(
            "keydown",
            evento => {

                if (
                    evento.key === "Escape"
                ) {
                    cerrarImagen();
                }

            }
        );


        /* =========================================================
           INICIAR
        ========================================================= */

        cargarProductos();

    </script>

</body>

</html>
